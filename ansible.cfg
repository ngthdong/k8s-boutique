[defaults]
inventory = inventory.ini
roles_path = ./roles
collections_path = ./collections
filter_plugins = ./filter_plugins
interpreter_python = auto_silent
retry_files_enabled = False
# The VMs are destroyed and recreated often, so their host keys change.
# Acceptable for a local lab; never for real servers.
host_key_checking = False

[ssh_connection]
pipelining = True